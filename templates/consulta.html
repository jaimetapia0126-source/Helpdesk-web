{% extends "base.html" %}
{% block titulo %}Consultar caso{% endblock %}
{% block contenido %}
<section class="tarjeta angosta">
  <h1>Consultar seguimiento</h1>
  <p class="muted">Escribe el código de tu ticket (ej. TK-2026-00001).</p>
  <form method="post">
    <label>Código del ticket<input name="codigo" placeholder="TK-2026-00001" required autofocus></label>
    <div class="acciones"><button class="btn" type="submit">Ver seguimiento</button></div>
  </form>
</section>
{% endblock %}
