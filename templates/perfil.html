{% extends "base.html" %}
{% block titulo %}Mi perfil{% endblock %}
{% block contenido %}
<section class="tarjeta">
  <h1>Mis datos</h1>
  <p class="muted">Estos datos se usan automáticamente en cada ticket que crees.</p>
  <form method="post" class="grid2">
    <label>Nombre *<input name="nombre" value="{{ u.nombre }}" maxlength="80" required></label>
    <label>Apellido *<input name="apellido" value="{{ u.apellido }}" maxlength="80" required></label>
    <label>Dirección *<input name="direccion" value="{{ u.direccion }}" maxlength="200" required></label>
    <label>Teléfono *<input name="telefono" value="{{ u.telefono }}" maxlength="15" inputmode="tel" required></label>
    <label>Correo electrónico<input value="{{ u.email }}" disabled></label>
    <label>Nueva contraseña (opcional)<input type="password" name="clave" minlength="6" placeholder="Déjala vacía para no cambiarla"></label>
    <div class="full acciones">
      <a href="{{ url_for('mis_tickets') }}">Ver mis tickets</a>
      <button class="btn" type="submit">Guardar cambios</button>
    </div>
  </form>
</section>
{% endblock %}
